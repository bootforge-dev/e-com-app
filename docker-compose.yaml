services:

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./docker:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks:
      - e_com
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  config-server:
    image: config-server:1.0
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - e_com
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  discovery-server:
    image: discovery-server:1.0
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: discovery-server
    environment:
      EUREKA_SERVER: discovery-server
    ports:
      - "8761:8761"
    networks:
      - e_com
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    image: api-gateway:1.0
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      EUREKA_SERVER: discovery-server
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "9100:9100"
    networks:
      - e_com
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  product-service:
    image: product-service:1.0
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_SERVER: discovery-server
      CONFIG_SERVER_URL: http://config-server:8888
      API_GATEWAY_URL: ${API_GATEWAY_URL}
    ports:
      - "9001:9001"
    networks:
      - e_com
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy


  inventory-service:
    image: inventory-service:1.0
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_SERVER: discovery-server
      CONFIG_SERVER_URL: http://config-server:8888
      API_GATEWAY_URL: ${API_GATEWAY_URL}
    ports:
      - "9002:9002"
    networks:
      - e_com
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  order-service:
    image: order-service:1.0
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_SERVER: discovery-server
      CONFIG_SERVER_URL: http://config-server:8888
      API_GATEWAY_URL: ${API_GATEWAY_URL}
    ports:
      - "9003:9003"
    networks:
      - e_com
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  payment-service:
    image: payment-service:1.0
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_SERVER: discovery-server
      CONFIG_SERVER_URL: http://config-server:8888
      API_GATEWAY_URL: ${API_GATEWAY_URL}
    ports:
      - "9004:9004"
    networks:
      - e_com
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

volumes:
  mysql_data:
networks:
  e_com:
    driver: bridge